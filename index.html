<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table (with Flexbox)</title>

    <style>
        section.columns-of-rows {
            display: flex;
            flex-direction: row;
            div {
                border: 1px solid pink;
            }
        }
        section.rows-of-columns {
            border: 1px solid pink;
            padding: 4px;

            div.row {
                display: flex;
                justify-content: space-between;
                border: 1px solid pink;
                padding: 4px;

                div {
                    border: 1px solid pink;
                }
            }
        }
    </style>
</head>
<body>

<h1> Tic-Tac-Toe style grid using three columns of three rows</h1>

<section class="columns-of-rows">
    <div>
        <div>row 1</div>
        <div>row 2</div>
        <div>row 3</div>
    </div>
    <div>
        <div>row 1</div>
        <div>row 2</div>
        <div>row 3</div>
    </div>
    <div>
        <div>row 1</div>
        <div>row 2</div>
        <div>row 3</div>
    </div>
</section>

<h1> Tic-Tac-Toe style grid using three rows of three columns</h1>
<section class="rows-of-columns">
    <div class="row">
        <div>column 1</div>
        <div>column 2</div>
        <div>column 3</div>
    </div>
    <div class="row">
        <div>column 1</div>
        <div>column 2</div>
        <div>column 3</div>
    </div>
    <div class="row">
        <div>column 1</div>
        <div>column 2</div>
        <div>column 3</div>
    </div>

</section>
</body>
</html>
